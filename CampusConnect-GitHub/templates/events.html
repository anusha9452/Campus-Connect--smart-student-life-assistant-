{% extends "base.html" %}
{% block content %}
<div class="card">
  <div class="card-head">Campus Events</div>
  <div class="table-wrap"><table>
    <tr><th>Event</th><th>Date</th><th>Venue</th><th>Description</th><th>Status</th></tr>
    {% for e in rows %}
    <tr><td>{{ e.title }}</td><td>{{ e.event_date }}</td><td>{{ e.venue }}</td><td>{{ e.description }}</td>
      <td><span class="badge {{ 'b-ok' if e.event_date >= today else 'b-err' }}">{{ 'Upcoming' if e.event_date >= today else 'Completed' }}</span></td></tr>
    {% endfor %}
  </table></div>
</div>
{% endblock %}
