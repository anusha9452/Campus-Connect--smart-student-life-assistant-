{% extends "base.html" %}
{% block content %}
{% for n in rows %}
<div class="card">
  <div class="card-head">{{ n.title }} <span class="badge b-info">{{ n.category }}</span></div>
  <div class="card-body"><p>{{ n.body }}</p><small>Posted on: {{ n.posted_on }}</small></div>
</div>
{% endfor %}
{% endblock %}
