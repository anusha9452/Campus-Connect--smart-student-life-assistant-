{% extends "base.html" %}
{% block content %}
<div class="card">
  <div class="card-head">Add Study Plan</div>
  <form method="post" action="/planner/add" class="inline-form">
    <select name="day">{% for d in days %}<option>{{ d }}</option>{% endfor %}</select>
    <input type="text" name="topic" placeholder="Topic / Subject" required>
    <input type="number" name="hours" min="0.5" max="12" step="0.5" value="1" required>
    <button class="btn btn-primary">Add</button>
  </form>
</div>
<div class="card">
  <div class="card-head">Weekly Study Plan</div>
  <div class="table-wrap"><table>
    <tr><th>Day</th><th>Topic</th><th>Hours</th><th>Action</th></tr>
    {% for p in rows %}
    <tr><td>{{ p.day }}</td><td>{{ p.topic }}</td><td>{{ p.hours }}</td>
      <td><form method="post" action="/delete/planner/{{ p.id }}" class="confirm"><button class="btn btn-danger btn-sm">Delete</button></form></td></tr>
    {% else %}<tr><td colspan="4" class="empty">No study plan added.</td></tr>{% endfor %}
  </table></div>
</div>
{% endblock %}
