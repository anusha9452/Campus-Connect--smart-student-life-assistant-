{% extends "base.html" %}
{% block content %}
<div class="card">
  <div class="card-head">Student Profile</div>
  <div class="card-body">
    <form method="post" action="/profile" class="profile-form">
      <label>Full Name</label><input type="text" name="name" value="{{ user.name }}" required>
      <label>Email (cannot be changed)</label><input type="text" value="{{ user.email }}" disabled>
      <label>Branch</label><input type="text" name="branch" value="{{ user.branch }}" required>
      <label>Year</label><input type="text" name="year" value="{{ user.year }}" required>
      <label>Phone</label><input type="text" name="phone" value="{{ user.phone }}">
      <button class="btn btn-primary">Update Profile</button>
    </form>
  </div>
</div>
{% endblock %}
